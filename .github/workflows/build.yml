name: Build AI Digital Companion APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'AI-Digital-Companion-source.zip'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmake;3.22.1 ndk;27.2.12479018'
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract project
        run: unzip -oq AI-Digital-Companion-source.zip -d .
      - name: Fetch Stable Diffusion C++ runtime
        run: git clone --depth 1 --recurse-submodules https://github.com/leejet/stable-diffusion.cpp.git app/src/main/cpp/stable-diffusion.cpp
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Digital-Companion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
